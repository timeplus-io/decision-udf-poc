# docker-compose.yml — one-command demo: Timeplus Enterprise + a decision backend. Data is generated inside the
# engine with random streams; the decision model is called from a Python UDF that also runs inside the engine.
#
#   cp .env.example .env
#   docker compose --profile ollama up -d          # engine + Ollama (local decision model)        <- default demo
#   docker compose --profile fake   up -d          # engine + fake /v1/systemone (no model, wiring/chaos tests)
#   docker compose                  up -d          # engine only; backend = jev (cloud) or a native Ollama via .env
#   ./scripts/pull_model.sh                        # (ollama profile) pull the decision model once
#   ./scripts/install.sh                           # streams, UDF, smoke test, both use cases (pure SQL)
#
# Python UDFs exist only in the amd64 build of Timeplus Enterprise, so the engine is pinned to linux/amd64;
# on Apple silicon it runs under emulation (slower, but fine for the demo). Proton OSS has no Python UDF.
#
# Mac with Apple GPU: run Ollama natively on the host instead of the container and set
#   DECISION_BASE_URL=http://host.docker.internal:11434  in .env (Docker on macOS has no GPU access).

x-engine-env: &engine-env
  TIMEPLUS_USER: ${TIMEPLUS_USER:-proton}
  TIMEPLUS_PASSWORD: ${TIMEPLUS_PASSWORD:-timeplus@t+}
  DECISION_BACKEND: ${DECISION_BACKEND:-local}
  DECISION_BASE_URL: ${DECISION_BASE_URL:-http://decision:11434}
  DECISION_MODEL: ${DECISION_MODEL:-}
  DECISION_PACK_ROWS: ${DECISION_PACK_ROWS:-}
  DECISION_MAX_IN_FLIGHT: ${DECISION_MAX_IN_FLIGHT:-}
  DECISION_TIMEOUT_S: ${DECISION_TIMEOUT_S:-}
  DECISION_BLOCK_DEADLINE_S: ${DECISION_BLOCK_DEADLINE_S:-}
  DECISION_RETRIES: ${DECISION_RETRIES:-}
  DECISION_CACHE_TTL_S: ${DECISION_CACHE_TTL_S:-}
  DECISION_TEMPERATURES: ${DECISION_TEMPERATURES:-}
  TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}

services:
  timeplus:
    image: ${ENGINE_IMAGE:-timeplus/timeplus-enterprise:3.4.1-rc.10}
    platform: linux/amd64
    container_name: ${ENGINE_CONTAINER:-tp-decision-poc}
    ports:
      - "8000:8000"   # console
      - "8123:8123"   # SQL over HTTP (user proton / timeplus@t+ by default)
      - "8463:8463"   # native
      - "3218:3218"   # REST
    environment:
      <<: *engine-env
      ENABLE_DATA_PREALLOCATE: "false"   # otherwise timeplusd preallocates ~2 GB of native log per stream
    volumes:
      - ./sql:/sql:ro                 # so `timeplusd client --queries-file /sql/...` works inside the container too
      - tp-data:/timeplus/data
    healthcheck:
      test: ["CMD-SHELL", "timeplusd client -u $$TIMEPLUS_USER --password $$TIMEPLUS_PASSWORD -q 'SELECT 1'"]   # the image has no curl
      interval: 5s
      timeout: 3s
      retries: 60
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Backend B (default): Ollama serving /v1/systemone with a decision model from its library.
  decision-ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: tp-decision-ollama
    networks:
      default:
        aliases: ["decision"]
    ports:
      - "11434:11434"   # clashes with a native Ollama on the host; use that one instead (see header)
    volumes:
      - ollama-models:/root/.ollama     # pre-pulled models survive restarts; copy this volume for air-gapped hosts
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "8"
    # NVIDIA GPU on Linux: uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  # Backend B (no model): stdlib fake /v1/systemone in its own container, for wiring and chaos tests.
  # Reachable from the engine as http://decision:11434; not published on the host.
  decision-fake:
    profiles: ["fake"]
    image: python:3.12-slim
    container_name: tp-decision-fake
    command: ["python", "/app/fake_systemone.py", "--port", "11434", "--latency-ms", "${FAKE_LATENCY_MS:-120}", "--jitter-ms", "60", "--fail-rate", "${FAKE_FAIL_RATE:-0}"]
    volumes:
      - ./backend/fake_systemone.py:/app/fake_systemone.py:ro
    networks:
      default:
        aliases: ["decision"]

  # Backend B (alternative packaging): llama-server with the GGUF baked into the image (backend/Dockerfile.local).
  decision-llama:
    profiles: ["llama"]
    image: ${DECISION_LOCAL_IMAGE:-timeplus/decision-local:decider-2b-q8_0}
    container_name: tp-decision-llama
    command: ["--port", "11434"]
    networks:
      default:
        aliases: ["decision"]
    ports:
      - "11434:11434"

volumes:
  tp-data:
  ollama-models:
